# If you're deploying from the `hugo` branch
[deployment]
  [[deployment.targets]]
    name = "github"
    URL = "https://github.com/PersonalComputerRetailer/test2023.git"
    branch = "hugo"
    target = "public"

[markup.goldmark.renderer]
unsafe = true

[params]
  author = "WILL"
  description = "Tech notes, experiments, and thoughts from my cyber warehouse."

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[services]
  [services.googleAnalytics]
    id = "G-6XELVJJ51M"
